    <script>
      (() => {
        let mode = 'system';
        try {
          mode = localStorage.getItem('leneu:theme') || 'system';
        } catch {}
        const dark =
          mode === 'dark' ||
          (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1b1e1d' : '#f6f5f0';
      })();
    </script>
    <title>anotar — 생각을 놓아두는 곳</title>
