# Planner (leneu.store) checks only. Not wired to any server deploy:
# harukan releases are still applied manually (apps/harukan/docs/LAUNCH_RUNBOOK.md).
name: Verify harukan
on:
  push:
    branches: [main, restructure]
    paths: ['apps/harukan/**', '.github/workflows/harukan.yml']
  pull_request:
    paths: ['apps/harukan/**', '.github/workflows/harukan.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/harukan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/harukan/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
