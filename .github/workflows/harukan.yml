# harukan checks. A successful run on main is what the server deploys: harukan-deploy.timer polls this
# workflow (apps/anotar/deploy/oracle-poll.py harukan) and runs apps/harukan/deploy/harukan-deploy.sh.
name: Verify harukan
on:
  push:
    branches: [main, restructure]
    paths: ['apps/harukan/**', '.github/workflows/harukan.yml']
  pull_request:
    paths: ['apps/harukan/**', '.github/workflows/harukan.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/harukan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/harukan/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
