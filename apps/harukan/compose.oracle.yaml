name: anotar-planner
services:
  planner:
    build: .
    image: anotar-planner:${PLANNER_RELEASE:-local}
    restart: unless-stopped
    network_mode: host
    env_file: /srv/anotar-planner/.env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 8794
      PLANNER_DATA_DIR: /data
      HOST_STATUS_FILE: /host/status.json
    volumes:
      - /srv/anotar-planner/data:/data
      - /srv/anotar-planner/backups:/backups
      # Pending security reboot, written by leneu-service-watch; shown as a maintenance notice.
      - /var/lib/leneu-host:/host:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8794/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
