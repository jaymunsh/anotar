<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Harukan">
  <!-- Harukan (하루칸): a day of 칸 (cells) — a 3×3 grid with one block boxed across two cells, one more cell filled. -->
  <rect width="512" height="512" rx="112" fill="#20322d"/>
  <g fill="#f6f5f0" fill-opacity=".14">
    <rect x="92" y="92" width="96" height="96" rx="22"/>
    <rect x="208" y="92" width="96" height="96" rx="22"/>
    <rect x="324" y="92" width="96" height="96" rx="22"/>
    <rect x="324" y="208" width="96" height="96" rx="22"/>
    <rect x="92" y="324" width="96" height="96" rx="22"/>
    <rect x="208" y="324" width="96" height="96" rx="22"/>
  </g>
  <rect x="92" y="208" width="212" height="96" rx="22" fill="#d8e6b5"/>
  <rect x="324" y="324" width="96" height="96" rx="22" fill="#8cc09d"/>
</svg>
