services:
  storage:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 192
    tmpfs:
      - /tmp:size=768m,mode=1777
    # Wiki build uploaded by the Mac over SSH; served read-only to the signed-in owner (B안).
    environment:
      MEMORY_DATA_FILE: /memory/data.json
    volumes:
      - ${LENEU_MEMORY_DIR:-/srv/leneu/memory}:/memory:ro
  share:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
  sites:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
